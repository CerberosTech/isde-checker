name: Build and deploy ISDE-checker to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # weekly refresh of RVO list (Mon 04:23 UTC)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # Ping IndexNow (Bing/Yandex/Seznam/Naver) with the live sitemap after each deploy. Key is public, no secrets.
    needs: deploy
    if: success()  # also runs on the weekly cron (new RVO list = new URLs)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs
